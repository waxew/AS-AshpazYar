name: Build AshpazYar

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Android debug and Web distribution
        run: ./gradlew :androidApp:assembleDebug :webApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AshpazYar-Android-Debug
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AshpazYar-Web
          path: webApp/build/dist/wasmJs/productionExecutable/
