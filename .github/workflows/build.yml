name: Build AshpazYar

on:
  push:
    branches: [ "main", "feature/**" ]

# برای هر شاخه فقط آخرین Workflow لازم است؛ Push جدید اجرای قدیمی همان شاخه را لغو می‌کند.
concurrency:
  group: ashpazyar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Android debug and release
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AshpazYar-Android-Debug
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AshpazYar-Android-Release-Unsigned
          path: androidApp/build/outputs/apk/release/*.apk

  android_extra:
    name: TV and Automotive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build TV and Automotive
        run: ./gradlew :tvApp:assembleDebug :automotiveApp:assembleDebug --stacktrace

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: AshpazYar-TV-Debug
          path: tvApp/build/outputs/apk/debug/*.apk

      - name: Upload Automotive APK
        uses: actions/upload-artifact@v4
        with:
          name: AshpazYar-Automotive-Debug
          path: automotiveApp/build/outputs/apk/debug/*.apk

  desktop_web:
    name: Desktop and Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile Desktop and build Web distribution
        run: ./gradlew :desktopApp:compileKotlinJvm :webApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: AshpazYar-Web
          path: webApp/build/dist/wasmJs/productionExecutable/
